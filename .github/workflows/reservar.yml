name: Reservar clase CORE

on:
  schedule:
    # RESPALDO. Comprobado (jul 2026): el cron interno de GitHub dispara en este
    # repo con 3 a 4,5 horas de RETRASO (encola los 'schedule' con baja prioridad;
    # no es configurable). El disparo PUNTUAL de las 00:02 AR lo hace cron-job.org
    # vía workflow_dispatch, que sí corre al instante (ver README). Estos crons
    # quedan como red de seguridad; el bot es idempotente (no duplica reservas).
    # Horarios NOMINALES en UTC (Argentina = UTC-3), de lunes a viernes:
    - cron: "50 2 * * 1-5"   # nominal 23:50 AR -> en la práctica ~02:30-04:30 AR
    - cron: "10 3 * * 1-5"   # nominal 00:10 AR (respaldo)
    - cron: "30 3 * * 1-5"   # nominal 00:30 AR (respaldo)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (llega al botón Reservar pero NO reserva)"
        type: boolean
        default: true
      now:
        description: "Ejecutar ya (no esperar hasta las 00:01)"
        type: boolean
        default: true

jobs:
  reservar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar bot
        env:
          COREFIT_EMAIL: ${{ secrets.COREFIT_EMAIL }}
          COREFIT_PASSWORD: ${{ secrets.COREFIT_PASSWORD }}
          # Opcionales (si no se definen, usan los valores por defecto del script):
          COREFIT_TARGET_TIME: ${{ vars.COREFIT_TARGET_TIME }}
          COREFIT_DAYS_AHEAD: ${{ vars.COREFIT_DAYS_AHEAD }}
          COREFIT_FIRE_TIME: ${{ vars.COREFIT_FIRE_TIME }}
          COREFIT_BRANCH: ${{ vars.COREFIT_BRANCH }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
            [ "${{ inputs.now }}" = "true" ] && ARGS="$ARGS --now"
          fi
          echo "Ejecutando: python reservar.py $ARGS"
          # Reintento automático: una corrida programada falló por un error
          # transitorio del sitio; si falla, esperamos 60s y probamos de nuevo.
          python reservar.py $ARGS || { echo "Falló; reintento en 60s..."; sleep 60; python reservar.py $ARGS; }

      - name: Subir screenshots (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
