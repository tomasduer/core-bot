name: Reservar clase CORE

on:
  schedule:
    # RESPALDO. La inscripción abre a las 08:00 AR (misma hora que la clase, una
    # semana antes). El disparo PUNTUAL de las 08:00 lo hace cron-job.org vía
    # workflow_dispatch, que corre al instante (ver README). Estos crons quedan de
    # red de seguridad, PERO el cron interno de GitHub se atrasa 3-4,5 h, así que
    # reservan recién ~11:00-13:00 AR (solo sirven si el cupo sigue libre a esa
    # hora). El bot es idempotente: no duplica reservas.
    # Horarios NOMINALES en UTC (Argentina = UTC-3), de lunes a viernes:
    - cron: "0 11 * * 1-5"    # nominal 08:00 AR (respaldo tardío)
    - cron: "20 11 * * 1-5"   # nominal 08:20 AR (respaldo tardío)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (llega al botón Reservar pero NO reserva)"
        type: boolean
        default: true
      now:
        description: "Reservar YA (sin esperar la hora de inscripción). cron-job.org manda false."
        type: boolean
        default: true

jobs:
  reservar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar bot
        env:
          COREFIT_EMAIL: ${{ secrets.COREFIT_EMAIL }}
          COREFIT_PASSWORD: ${{ secrets.COREFIT_PASSWORD }}
          # Opcionales (si no se definen, usan los valores por defecto del script):
          COREFIT_TARGET_TIME: ${{ vars.COREFIT_TARGET_TIME }}
          COREFIT_DAYS_AHEAD: ${{ vars.COREFIT_DAYS_AHEAD }}
          COREFIT_FIRE_TIME: ${{ vars.COREFIT_FIRE_TIME }}
          COREFIT_BRANCH: ${{ vars.COREFIT_BRANCH }}
        run: |
          # schedule = respaldo tardío (el cron interno de GitHub corre ~mediodía) ->
          #   reservar de inmediato (--now), la inscripción abrió hace rato.
          # workflow_dispatch = disparo PUNTUAL de cron-job.org, que dispara unos
          #   minutos ANTES de las 08:00 con now=false: el bot hace login y se
          #   "calienta", y espera hasta las 08:00 exactas para reservar (ver README).
          #   Los runs manuales usan los defaults (now=true = reservar ya).
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--now"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
            [ "${{ inputs.now }}" = "true" ] && ARGS="$ARGS --now"
          fi
          echo "Ejecutando: python reservar.py $ARGS"
          # Reintento automático ante un error transitorio del sitio: espera 60s y reintenta.
          python reservar.py $ARGS || { echo "Falló; reintento en 60s..."; sleep 60; python reservar.py $ARGS; }

      - name: Subir screenshots (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
