name: Reservar clase CORE

on:
  schedule:
    # Varios disparos ESCALONADOS para dar redundancia ante la impuntualidad/caídas
    # del cron de GitHub. El bot es idempotente: si la clase ya está reservada, no
    # hace nada. Horarios en UTC (Argentina = UTC-3), de lunes a viernes:
    - cron: "50 2 * * 1-5"   # 23:50 AR (noche anterior) -> espera hasta 00:01 y reserva
    - cron: "10 3 * * 1-5"   # 00:10 AR -> reserva de inmediato (respaldo 1)
    - cron: "30 3 * * 1-5"   # 00:30 AR -> reserva de inmediato (respaldo 2)
    # TEMPORAL - prueba única de que los cron disparan en este repo. BORRAR luego.
    - cron: "40 3 3 7 *"     # 03:40 UTC del 3-jul-2026 (00:40 AR)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (llega al botón Reservar pero NO reserva)"
        type: boolean
        default: true
      now:
        description: "Ejecutar ya (no esperar hasta las 00:01)"
        type: boolean
        default: true

jobs:
  reservar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar bot
        env:
          COREFIT_EMAIL: ${{ secrets.COREFIT_EMAIL }}
          COREFIT_PASSWORD: ${{ secrets.COREFIT_PASSWORD }}
          # Opcionales (si no se definen, usan los valores por defecto del script):
          COREFIT_TARGET_TIME: ${{ vars.COREFIT_TARGET_TIME }}
          COREFIT_DAYS_AHEAD: ${{ vars.COREFIT_DAYS_AHEAD }}
          COREFIT_FIRE_TIME: ${{ vars.COREFIT_FIRE_TIME }}
          COREFIT_BRANCH: ${{ vars.COREFIT_BRANCH }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
            [ "${{ inputs.now }}" = "true" ] && ARGS="$ARGS --now"
          fi
          echo "Ejecutando: python reservar.py $ARGS"
          python reservar.py $ARGS

      - name: Subir screenshots (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
